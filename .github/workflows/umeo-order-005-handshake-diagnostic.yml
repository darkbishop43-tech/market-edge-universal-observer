name: UMEO Order 005 Handshake Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/umeo-order-005-handshake-diagnostic.yml"
      - "src/stream/kalshi-stream-do.js"
      - "wrangler.toml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read fresh production acceptance
        shell: bash
        run: |
          set -euo pipefail
          base="https://market-edge-universal-observer.darkbishop43.workers.dev"
          curl -fsS "$base/stream-acceptance" > /tmp/acceptance.json
          curl -fsS "$base/stream-state" > /tmp/stream-state.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/acceptance.json'))
          s=json.load(open('/tmp/stream-state.json'))
          c=d.get('connection') or {}
          print("ACCEPTANCE")
          print(json.dumps(d, indent=2))
          print("STREAM_STATE")
          print(json.dumps(s, indent=2))
          assert s.get('signingSelfCheck',{}).get('keyType') in ('rsa','rsa-pss'), s
          assert s.get('signingSelfCheck',{}).get('algorithm')=='RSA-PSS-SHA256', s
          assert s.get('signingSelfCheck',{}).get('localSignatureVerified') is True, s
          assert d['credential']['present'] is True, d
          assert d['credential']['explicitReadScopeConfigured'] is True, d
          assert d['credential']['configuredScope']=='read', d
          assert d['credential']['writeScopesConfigured'] is False, d
          assert d['tradingCapability'] is False, d
          assert d['orderCapability'] is False, d
          assert d['cancellationCapability'] is False, d
          assert d['transferCapability'] is False, d
          assert d['bankrollCapability'] is False, d
          assert d['baselineBindingPresent'] is False, d
          err=str(c.get('lastError') or '')
          assert 'PrivateKeyObject' not in err, d
          assert 'options.key' not in err, d
          PY

