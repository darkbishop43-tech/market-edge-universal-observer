name: UMEO Runtime Credential Gate Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/umeo-runtime-credential-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed v0.7.0
        shell: bash
        run: |
          set -euo pipefail
          base="https://market-edge-universal-observer.darkbishop43.workers.dev"
          for i in $(seq 1 30); do
            body="$(curl -fsS "$base/stream-readiness-test" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '"version": "0.7.0"'; then
              printf '%s\n' "$body" > /tmp/readiness.json
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for deployed v0.7.0"
          exit 1

      - name: Verify fail-closed credential gate
        shell: bash
        run: |
          set -euo pipefail
          base="https://market-edge-universal-observer.darkbishop43.workers.dev"
          curl -fsS "$base/stream-acceptance" > /tmp/acceptance-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/acceptance-before.json'))
          assert d['version']=='0.7.0', d
          assert d['result']=='READY_FOR_UMEO_READ_ONLY_CREDENTIAL', d
          assert d['credential']['present'] is False, d
          assert d['credential']['explicitReadScopeConfigured'] is False, d
          assert d['connection']['state']=='NO_CREDENTIAL', d
          assert d['connection']['authenticated'] is False, d
          assert d['connection']['subscriptionAcknowledged'] is False, d
          assert d['lastGenuineProviderMessage'] is None, d
          assert d['persistence']=='NO_REAL_PROVIDER_EVIDENCE_YET', d
          assert d['tradingCapability'] is False, d
          assert d['orderCapability'] is False, d
          assert d['cancellationCapability'] is False, d
          assert d['transferCapability'] is False, d
          assert d['bankrollCapability'] is False, d
          assert d['baselineBindingPresent'] is False, d
          print(json.dumps(d, indent=2))
          PY

      - name: Verify simulated fixture persistence is segregated
        shell: bash
        run: |
          set -euo pipefail
          base="https://market-edge-universal-observer.darkbishop43.workers.dev"
          curl -fsS "$base/stream-fixture-test" > /tmp/fixture.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/fixture.json'))
          assert d['ok'] is True, d
          assert d['test']=='SIMULATED_TEST_FIXTURE', d
          assert d['parser']=='PASS', d
          assert d['persistence']=='PERSISTED', d
          assert d['realProviderEvidence'] is False, d
          assert d['live'] is False, d
          assert d['tradingCapability'] is False, d
          print(json.dumps(d, indent=2))
          PY

      - name: Verify simulated fixture cannot satisfy real acceptance
        shell: bash
        run: |
          set -euo pipefail
          base="https://market-edge-universal-observer.darkbishop43.workers.dev"
          curl -fsS "$base/stream-acceptance" > /tmp/acceptance-after.json
          curl -fsS "$base/health" > /tmp/health.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/acceptance-after.json'))
          h=json.load(open('/tmp/health.json'))
          assert a['result']=='READY_FOR_UMEO_READ_ONLY_CREDENTIAL', a
          assert a['lastGenuineProviderMessage'] is None, a
          assert a['simulatedEvidenceCountsAsAcceptance'] is False, a
          assert a['tradingCapability'] is False, a
          assert h['version']=='0.7.0', h
          assert h['tradingCapability'] is False, h
          assert h['stream']['durableObjectBound'] is True, h
          assert h['d1']['schemaReady'] is True, h
          assert h['d1']['expectedTables']==6, h
          print("ACCEPTANCE_AFTER")
          print(json.dumps(a, indent=2))
          print("HEALTH")
          print(json.dumps(h, indent=2))
          PY
