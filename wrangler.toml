name = "market-edge-universal-observer"
main = "src/index.js"
compatibility_date = "2026-09-21"

# V0 is intentionally observation-only.
# No Baseline/Payne/NFE bindings and no trading credentials belong here.
#
# Isolated Universal Observer evidence ledger. This declaration mirrors the
# already-verified Cloudflare Production DB binding.
[[d1_databases]]
binding = "DB"
database_name = "market-edge-universal-observer-ledger"
database_id = "af04009f-010f-4020-8d66-df8fcba1b823"

# A single Cron trigger will be enabled during Cloudflare activation.


[[durable_objects.bindings]]
name = "UMEO_STREAM"
class_name = "KalshiStreamObserver"

[[migrations]]
tag = "v0_7_0_stream_do"
new_sqlite_classes = ["KalshiStreamObserver"]

[triggers]
crons = ["*/5 * * * *"]


[vars]
# Non-secret fail-closed scope assertion for the separately scoped Kalshi Observer key.
# The provider credential itself was created with explicit read permission; no write scope is authorized.
KALSHI_OBSERVER_SCOPES = "read"
